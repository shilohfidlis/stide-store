<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>STRIDE Seller</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--b:#050505;--g:#111318;--s:#C7CBD1;--l:#C6FF00;color-scheme:dark}*{box-sizing:border-box;margin:0}
body{background:var(--b);color:#fff;font:400 15px/1.5 Manrope,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}.d{font-family:Unbounded,sans-serif;font-weight:800}
#app{max-width:900px;margin:auto;padding:16px 14px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0;scrollbar-width:none;position:sticky;top:0;background:var(--b);padding:6px 0;z-index:5}
.ch,.ib{flex:none;padding:9px 14px;border:1px solid #2a2d35;border-radius:99px;font-weight:600}.ch.on{background:#fff;color:#000}
.btn{padding:14px 22px;border-radius:99px;font-weight:800;background:var(--l);color:#000;letter-spacing:.04em}.btn.o{background:none;color:#fff;border:1px solid var(--s)}
.ar{background:var(--g);border:1px solid #1f222a;border-radius:16px;padding:14px;margin-bottom:10px}.tg{color:var(--s);font-size:13px}.em{text-align:center;color:var(--s);padding:50px 10px}
label{display:block;font-size:12px;font-weight:800;margin-top:10px;color:#9aa0aa}input,select,textarea{width:100%;background:var(--b);border:1px solid #2a2d35;border-radius:12px;padding:10px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}.sg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.sg input{padding:8px 2px;text-align:center}
.tot{display:flex;justify-content:space-between;font-weight:800;margin:10px 0}.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;border:1px solid #333}.pill.g{background:var(--l);color:#000;border-color:var(--l)}
.dm{background:#c6ff0018;border:1px solid var(--l);border-radius:12px;padding:12px;font-size:13px;margin:12px 0}code{background:#000;border:1px solid #2a2d35;border-radius:6px;padding:2px 6px;font-size:12px;word-break:break-all}
#tt{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#fff;color:#000;padding:12px 20px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;max-width:90%}#tt.on{opacity:1;transform:translate(-50%,0)}
</style></head><body><div id="app"><div class="em">Loading…</div></div><div id="tt" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* STRIDE Seller app: separate from the customer site, same Supabase project. */
const SBURL='https://lowkxyfslpvdsxvciczh.supabase.co',SBKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxvd2t4eWZzbHB2ZHN4dmNpY3poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMzU4MTUsImV4cCI6MjEwOTkxMTgxNX0.2wrGRpXFFiHGwMzEhDPJ0sPo7UQCR65aIbkzyabapbo',SB=supabase.createClient(SBURL,SBKEY);
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const S={tab:'o',open:null,P:[],pay:{provider:'none',currency:'USD'}},fm=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:S.pay.currency||'USD',maximumFractionDigits:0}).format(n);
const toast=m=>{const t=$('#tt');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2400)};
const bad=r=>{if(r&&r.error){toast('Failed: '+r.error.message);return true}return false},T=()=>SB.from('products'),FM={name:'name',price:'price',cat:'category',tg:'tagline',d:'description'};
const isAdmin=async()=>{const{data:{session}}=await SB.auth.getSession();if(!session)return false;const{data}=await SB.rpc('is_admin');return data===true};
async function load(){const[p,s]=await Promise.all([T().select('*').order('sort_order'),SB.from('store_settings').select('*')]);S.P=p.data||[];(s.data||[]).forEach(r=>{S[r.key]=r.value});if(S.payments)S.pay=S.payments}
function login(msg){$('#app').innerHTML=`<h1 class="d" style="font-size:26px;margin-top:40px">STRIDE Seller</h1><div class="dm">Sign in with the seller account.${msg?'<br><b>'+esc(msg)+'</b>':''}</div><label>EMAIL</label><input id="ae" type="email" autocomplete="username"><label>PASSWORD</label><input id="ap" type="password" autocomplete="current-password"><button class="btn" style="width:100%;margin-top:16px" id="pg">SIGN IN</button>`;
$('#pg').onclick=async()=>{const{error}=await SB.auth.signInWithPassword({email:$('#ae').value.trim(),password:$('#ap').value});if(error)return login('Wrong email or password');if(!(await isAdmin())){await SB.auth.signOut();return login('This account is not a seller account')}start()}}
const pedit=p=>{const I=`data-i="${p.id}"`;return`<label>NAME</label><input data-f="name" ${I} value="${esc(p.name)}"><label>PRICE</label><input data-f="price" ${I} type="number" min="0" value="${p.price}"><label>CATEGORY</label><select data-f="cat" ${I}>${['Performance','Street','Luxury'].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select><label>TAGLINE</label><input data-f="tg" ${I} value="${esc(p.tagline)}"><label>DESCRIPTION</label><textarea data-f="d" ${I} rows="3">${esc(p.description)}</textarea>
<label>STOCK PER SIZE (0 = sold out)</label><div class="sg">${Object.keys(p.stock).map(n=>`<div><div class="tg" style="text-align:center">${n}</div><input type="number" min="0" data-s="${n}" ${I} value="${p.stock[n]}"></div>`).join('')}</div>
<label>3D MODEL (.glb file)</label><input type="file" accept=".glb" data-up="${p.id}"><div class="row" style="margin-top:8px">${p.model_path?`<button class="ch" data-fl="${p.id}">Turn shoe around</button><button class="ch" data-rm="${p.id}">Use default model</button>`:''}</div><p class="tg">Check how it looks on the customer site. Uploaded models keep their own colors.</p>
<div class="row" style="margin-top:12px"><button class="ch" data-hd="${p.id}">${p.hidden?'Publish to store':'Hide from store'}</button>${p.id.startsWith('x_')?`<button class="ch" data-dl="${p.id}">Delete</button>`:''}</div>`};
async function render(){let O=[],M=[];const[o,m]=await Promise.all([SB.from('orders').select('*').order('created_at',{ascending:false}),SB.from('messages').select('*').order('created_at',{ascending:false})]);O=o.data||[];M=m.data||[];
const nn=O.filter(x=>x.status==='New').length,um=M.filter(x=>!x.read).length,nm=id=>(S.P.find(p=>p.id===id)||{name:id}).name,pv=S.pay.provider||'none',hook=SBURL+'/functions/v1/payment-webhook';
const T_=[['o','Orders'+(nn?` (${nn})`:'')],['m','Messages'+(um?` (${um})`:'')],['p','Products'],['y','Payments'],['s','Store']];let b='';
if(S.tab==='o')b=O.length?O.map(o=>{const a=o.address||{},paid=o.payment_status==='paid';return`<div class="ar"><div class="top"><b>${esc(o.id)}</b><span class="pill ${paid?'g':''}">${paid?'PAID':'NOT PAID'}</span></div><span class="tg">${new Date(o.created_at).toLocaleString()}</span><br>${esc(o.customer_name)} · ${esc(o.email)}<br><span class="tg">${esc([a.street,a.city,a.country].filter(Boolean).join(', '))}</span><div style="margin:8px 0">${(o.items||[]).map(t=>`${t.q}× ${esc(nm(t.id))} (${esc(t.color)}, size ${esc(t.size)})`).join('<br>')}</div><div class="tot"><span class="tg">${esc(o.shipping_label||'')} · ${esc(o.payment_method||'')}</span><span>${fm(+o.total)}</span></div><select data-os="${o.id}">${['New','Packed','Shipped','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`}).join(''):'<div class="em">No orders yet. New orders from the store appear here.</div>';
else if(S.tab==='m')b=M.length?M.map(m=>`<div class="ar" style="${m.read?'':'border-color:var(--l)'}"><b>${esc(m.name)}</b> · <span class="tg">${esc(m.email)} · ${new Date(m.created_at).toLocaleString()}</span><p style="margin:8px 0">${esc(m.body)}</p><div class="row"><a class="ch" href="mailto:${esc(m.email)}">Reply by email</a><button class="ch" data-mr="${m.id}:${m.read?0:1}">${m.read?'Mark unread':'Mark read'}</button><button class="ch" data-md="${m.id}">Delete</button></div></div>`).join(''):'<div class="em">No messages yet.</div>';
else if(S.tab==='p')b=`<button class="btn" data-pn="1" style="margin-bottom:12px">+ ADD PRODUCT</button>`+S.P.map(p=>`<div class="ar"><div class="top"><div><b>STRIDE ${esc(p.name)}</b> · ${fm(+p.price)}<div class="tg">${p.hidden?'Hidden from store':'Live'} · ${p.model_path?'Custom 3D model':'Default 3D model'}</div></div><button class="ch" data-po="${p.id}">${S.open===p.id?'Close':'Edit'}</button></div>${S.open===p.id?pedit(p):''}</div>`).join('');
else if(S.tab==='y')b=`<div class="ar"><div class="top"><b>Paystack (recommended for Nigeria)</b><span class="pill ${pv==='paystack'&&S.pay.connected?'g':''}">${pv==='paystack'&&S.pay.connected?'CONNECTED ('+(S.pay.mode==='live'?'LIVE':'TEST')+')':'NOT CONNECTED'}</span></div><p class="tg" style="margin-top:6px">Customers pay on Paystack’s secure page by card, bank transfer or USSD. The money is paid out to the owner’s Nigerian bank account.</p>
<label>PAYSTACK SECRET KEY</label><input id="pks" type="password" autocomplete="off" placeholder="sk_test_… or sk_live_…"><label>CURRENCY CODE (prices are in this currency)</label><input id="pku" value="${esc(pv==='paystack'?(S.pay.currency||'NGN'):'NGN')}" maxlength="3" style="text-transform:uppercase">
<div class="row" style="margin-top:14px"><button class="btn" id="pkc">CONNECT PAYSTACK</button>${pv==='paystack'?'<button class="btn o" id="pkt">TEST CONNECTION</button><button class="ch" id="pkd">Disconnect</button>':''}</div></div>
<div class="ar"><b>How to get the Paystack Secret Key</b><p class="tg" style="margin-top:6px">1. Sign up free at <code>paystack.com</code> and verify the business.<br>2. In the Paystack dashboard open <b>Settings → API Keys &amp; Webhooks</b>.<br>3. Copy the <b>Test Secret Key</b> (starts with sk_test_) and paste it above. Place a test order on the shop and check it shows <b>PAID</b>.<br>4. When Paystack activates the account, paste the <b>Live Secret Key</b> (starts with sk_live_) the same way.</p></div>
<div class="ar"><div class="top"><b>PayPal</b> <span class="tg">(only if PayPal can pay out in the owner’s country)</span><span class="pill ${pv==='paypal'&&S.pay.connected?'g':''}">${pv==='paypal'&&S.pay.connected?'CONNECTED ('+(S.pay.mode==='live'?'LIVE':'TEST')+')':'NOT CONNECTED'}</span></div><p class="tg" style="margin-top:6px">Customers are sent to PayPal’s own secure page to pay. The money goes to the PayPal account connected here.</p>
<label>PAYPAL CLIENT ID</label><input id="pci" autocomplete="off" placeholder="Paste the Client ID"><label>PAYPAL SECRET</label><input id="pcs" type="password" autocomplete="off" placeholder="Paste the Secret"><label>MODE</label><select id="pmd"><option value="sandbox" ${S.pay.mode!=='live'?'selected':''}>Test (no real money)</option><option value="live" ${S.pay.mode==='live'?'selected':''}>Live (real money)</option></select><label>CURRENCY CODE (prices are in this currency)</label><input id="pcu" value="${esc(S.pay.currency||'USD')}" maxlength="3" style="text-transform:uppercase">
<div class="row" style="margin-top:14px"><button class="btn" id="ppc">CONNECT PAYPAL</button>${pv==='paypal'?'<button class="btn o" id="ppt">TEST CONNECTION</button><button class="ch" id="ppd">Disconnect</button>':''}</div></div>
<div class="ar"><b>How to get the Client ID and Secret</b><p class="tg" style="margin-top:6px">1. Sign in at <code>developer.paypal.com</code> with the PayPal Business account.<br>2. Open <b>Apps &amp; Credentials</b> and choose <b>Sandbox</b> for testing or <b>Live</b> for real money.<br>3. Tap <b>Create App</b>, then copy the <b>Client ID</b> and <b>Secret</b> into the boxes above.<br>4. Start in <b>Test</b> mode, place a test order on the shop, and check it shows <b>PAID</b>. Then repeat with the Live details and choose <b>Live</b>.</p></div>
<div class="dm">The Secret is stored on the server and can never be read back in this app or on the shop. Only the owner should ever see it.</div><div class="ar"><b>Payments off</b><p class="tg" style="margin:6px 0 10px">Turn online payment off. Customers will place orders and the seller arranges payment himself.</p><button class="ch" id="poff">Turn off online payment</button></div>`;
else b=`<div class="ar"><b>Homepage text</b><label>TITLE</label><input data-h="title" value="${esc((S.hero||{}).title||'STRIDE')}"><label>HEADLINE</label><input data-h="headline" value="${esc((S.hero||{}).headline||'MOVE DIFFERENT.')}"><label>SHORT LINE</label><input data-h="subline" value="${esc((S.hero||{}).subline||'')}"><p class="tg" style="margin-top:8px">Saves when you leave a field. Reload the store to see it.</p></div><div class="ar"><b>Shipping options</b><p class="tg" style="margin:4px 0 6px">Prices use the currency chosen in Payments. The shop and your orders use these exactly.</p>${(Array.isArray(S.shipping)&&S.shipping.length?S.shipping:[{label:'Standard (5-7 days)',cost:8},{label:'Express (1-2 days)',cost:20}]).map(x=>`<label>NAME</label><input data-shl="1" value="${esc(x.label)}"><label>COST</label><input data-shc="1" type="number" min="0" value="${x.cost}">`).join('')}</div>`;
$('#app').innerHTML=`<div class="top"><h1 class="d" style="font-size:20px">STRIDE Seller</h1><div class="row"><button class="ib" id="rf">Refresh</button><button class="ib" id="so">Sign out</button></div></div><div class="tabs">${T_.map(t=>`<button class="ch ${S.tab===t[0]?'on':''}" data-tb="${t[0]}">${t[1]}</button>`).join('')}</div>${b}`;
$('#rf').onclick=async()=>{await load();render()};$('#so').onclick=async()=>{await SB.auth.signOut();login()};
const setPay=async v=>{if(bad(await SB.from('store_settings').upsert({key:'payments',value:v})))return false;S.pay=v;S.payments=v;return true};
const pc=$('#ppc');if(pc)pc.onclick=async()=>{const id=$('#pci').value.trim(),sc=$('#pcs').value.trim(),md=$('#pmd').value,cu=($('#pcu').value||'USD').toUpperCase();if(!id||!sc)return toast('Paste both the Client ID and the Secret');toast('Connecting…');
if(bad(await SB.rpc('save_payment_secret',{p_provider:'paypal',p_client_id:id,p_secret:sc,p_mode:md})))return;if(await setPay({provider:'paypal',currency:cu,connected:true,mode:md})){const r=await SB.functions.invoke('paypal-checkout',{body:{action:'test'}});toast(r.data&&r.data.ok?'PayPal connected and working':'Saved, but PayPal did not accept these details');render()}};
const pt=$('#ppt');if(pt)pt.onclick=async()=>{toast('Testing…');const r=await SB.functions.invoke('paypal-checkout',{body:{action:'test'}});toast(r.data&&r.data.ok?'PayPal is connected and working ('+r.data.mode+')':'PayPal did not accept the saved details')};
const pd=$('#ppd');if(pd)pd.onclick=async()=>{if(!confirm('Disconnect PayPal?'))return;if(bad(await SB.rpc('disconnect_payment',{p_provider:'paypal'})))return;await setPay({provider:'none',currency:S.pay.currency||'USD'});toast('Disconnected');render()};
const pks=$('#pkc');if(pks)pks.onclick=async()=>{const k=$('#pks').value.trim(),cu=($('#pku').value||'NGN').toUpperCase();if(!/^sk_(test|live)_/.test(k))return toast('That is not a Paystack secret key. It starts with sk_test_ or sk_live_');const md=k.startsWith('sk_live_')?'live':'sandbox';toast('Connecting…');if(bad(await SB.rpc('save_payment_secret',{p_provider:'paystack',p_client_id:'paystack',p_secret:k,p_mode:md})))return;if(await setPay({provider:'paystack',currency:cu,connected:true,mode:md})){const r=await SB.functions.invoke('paystack-checkout',{body:{action:'test'}});toast(r.data&&r.data.ok?'Paystack connected and working':'Saved, but Paystack did not accept this key');render()}};
const pkt=$('#pkt');if(pkt)pkt.onclick=async()=>{toast('Testing…');const r=await SB.functions.invoke('paystack-checkout',{body:{action:'test'}});toast(r.data&&r.data.ok?'Paystack is connected and working ('+r.data.mode+')':'Paystack did not accept the saved key')};
const pkd=$('#pkd');if(pkd)pkd.onclick=async()=>{if(!confirm('Disconnect Paystack?'))return;if(bad(await SB.rpc('disconnect_payment',{p_provider:'paystack'})))return;await setPay({provider:'none',currency:S.pay.currency||'NGN'});toast('Disconnected');render()};
const po=$('#poff');if(po)po.onclick=async()=>{if(await setPay({provider:'none',currency:S.pay.currency||'USD'})){toast('Online payment is off');render()}}}
const rl=async m=>{await load();if(m)toast(m);render()};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset,f=id=>S.P.find(p=>p.id===id);
if(D.tb){S.tab=D.tb;render()}else if(D.po){S.open=S.open===D.po?null:D.po;render()}
else if(D.pn){const id='x_'+Date.now().toString(36);if(bad(await T().insert({id,name:'NEW',category:'Street',price:150,tagline:'New arrival',description:'Describe this sneaker.',hidden:true,sort_order:S.P.length+1,colors:[{n:'Black',u:'#111114',s:'#e9e9e9',a:'#C6FF00'},{n:'White',u:'#e9e9ec',s:'#111114',a:'#C6FF00'}],stock:Object.fromEntries([6,7,8,9,10,11,12].map(n=>[n,5]))})))return;S.open=id;rl()}
else if(D.hd){const p=f(D.hd);if(!bad(await T().update({hidden:!p.hidden}).eq('id',p.id)))rl()}
else if(D.dl){if(confirm('Delete this product?')){const p=f(D.dl);if(p.model_path)await SB.storage.from('models').remove([p.model_path]);if(!bad(await T().delete().eq('id',p.id))){S.open=null;rl()}}}
else if(D.fl){const p=f(D.fl);if(!bad(await T().update({model_flip:!p.model_flip}).eq('id',p.id)))rl('Updated. Check the store.')}
else if(D.rm){const p=f(D.rm);if(!bad(await T().update({model_path:null,model_flip:false}).eq('id',p.id))){await SB.storage.from('models').remove([p.model_path]);rl()}}
else if(D.mr){const[id,v]=D.mr.split(':');if(!bad(await SB.from('messages').update({read:v==='1'}).eq('id',id)))render()}
else if(D.md){if(!bad(await SB.from('messages').delete().eq('id',D.md)))render()}});
document.addEventListener('change',async e=>{const t=e.target,D=t.dataset;
if(D.f){const v=D.f==='price'?Math.max(0,+t.value||0):t.value;if(!bad(await T().update({[FM[D.f]]:v}).eq('id',D.i))){S.P.find(p=>p.id===D.i)[FM[D.f]]=v;toast('Saved')}}
else if(D.s){const p=S.P.find(x=>x.id===D.i),st={...p.stock,[D.s]:Math.max(0,Math.floor(+t.value||0))};if(!bad(await T().update({stock:st}).eq('id',D.i))){p.stock=st;toast('Saved')}}
else if(D.h){const H=Object.fromEntries([...document.querySelectorAll('[data-h]')].map(i=>[i.dataset.h,i.value]));if(!bad(await SB.from('store_settings').upsert({key:'hero',value:H}))){S.hero=H;toast('Saved')}}
else if(D.shl!==undefined||D.shc!==undefined){const r=[...document.querySelectorAll('[data-shl]')].map(i=>({label:i.value.trim()||'Shipping',cost:0}));document.querySelectorAll('[data-shc]').forEach((i,k)=>r[k].cost=Math.max(0,+i.value||0));if(!bad(await SB.from('store_settings').upsert({key:'shipping',value:r}))){S.shipping=r;toast('Saved')}}
else if(D.os){if(!bad(await SB.from('orders').update({status:t.value}).eq('id',D.os))){toast('Status updated');render()}}
else if(D.up){const fl=t.files[0];if(!fl)return;if(fl.size>20e6)return toast('That file is over 20 MB');const p=S.P.find(x=>x.id===D.up);toast('Uploading…');
try{const hd=new Uint8Array(await fl.slice(0,4).arrayBuffer());if(String.fromCharCode(...hd)!=='glTF')throw new Error('not a GLB file');const path=`${p.id}-${Date.now()}.glb`;let r=await SB.storage.from('models').upload(path,fl,{contentType:'model/gltf-binary',upsert:true});if(r.error)throw r.error;if(p.model_path)await SB.storage.from('models').remove([p.model_path]);r=await T().update({model_path:path,model_flip:false}).eq('id',p.id);if(r.error)throw r.error;await rl('3D model uploaded')}catch(err){toast('Upload failed: '+err.message)}}});
async function start(){await load();render()}
(async()=>{try{(await isAdmin())?start():login()}catch(e){login('Could not reach the server')}})();
</script></body></html>
